name: Deploy to GitHub Pages

# Publishes on every push to main. To publish from any other branch — to preview
# a change before merging it — run this workflow manually from the Actions tab
# and pick that branch; workflow_dispatch honours whichever ref you select.
#
# Neither will produce a site until Pages itself is enabled. See the
# "Check that GitHub Pages is switched on" step below.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queue rather than cancel, so a push during a
# deployment does not leave the site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Everything that would make the live site wrong runs before it ships.
      - name: Lint
        run: node tools/lint.mjs
      - name: Validate locales
        run: node tools/validate-locales.mjs
      - name: Validate scientific data
        run: node tools/validate-data.mjs
      - name: Unit tests
        run: node --test "tests/unit/**/*.test.js"

      - name: Assemble the site
        run: node tools/build-site.mjs --out _site

      - name: Build the single-file artifact
        run: node tools/build-artifact.mjs --out _site/standalone.html

      # Pages has to be switched on by a human before any of this can publish.
      # A workflow token cannot do it for you: asking configure-pages to create
      # the site returns "Resource not accessible by integration", and without
      # it you get a bare "Not Found". Both are opaque enough that a repository
      # can sit un-published for a long time while every other check is green,
      # so say plainly what is wrong and who has to fix it.
      - name: Check that GitHub Pages is switched on
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "GitHub Pages is enabled."
            exit 0
          fi
          cat <<'MSG' >&2
          ================================================================
          GitHub Pages is NOT enabled for this repository, so there is
          nothing to deploy to and the site URL will return 404.

          A repository owner or admin has to turn it on, once:

            Settings -> Pages -> Build and deployment
            Source: "GitHub Actions"

          This workflow cannot do it: the token it runs with is not
          permitted to create a Pages site.

          Everything else in this run succeeded. Re-run it after enabling
          Pages and the site will publish.
          ================================================================
          MSG
          exit 1

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
