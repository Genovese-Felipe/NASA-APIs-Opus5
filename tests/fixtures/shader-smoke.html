<!doctype html><html><head><meta charset="utf-8"><title>shader smoke</title></head>
<body><canvas id="c" width="320" height="200"></canvas>
<script type="module">
window.RESULT = { ok:false, stage:'start', errors:[] };
try {
  const { Renderer } = await import('/src/render/raytracer.js');
  const { buildScene } = await import('/src/astro/ephemeris.js');
  const { Camera } = await import('/src/render/camera.js');
  const { RING_SYSTEMS } = await import('/src/astro/planets.js');
  const canvas = document.getElementById('c');
  window.RESULT.stage = 'construct';
  const r = new Renderer(canvas, { quality: 'low' });
  window.RESULT.caps = r.caps;
  window.RESULT.stage = 'rings';
  const systems = Object.entries(RING_SYSTEMS).map(([bodyId, bands]) => ({ bodyId, bands }));
  r.setRingBodies(systems.map(s => s.bodyId));
  r.setRings(systems, new Map());
  window.RESULT.stage = 'scene';
  const scene = buildScene(2461256.5);
  const cam = new Camera();
  cam.focus = 'saturn'; cam.distanceRadii = 8;
  cam.update(0.016, scene, null, 0);
  window.RESULT.stage = 'render';
  for (let i=0;i<3;i++) r.render(scene, cam, { dt: 0.016 });
  const gl = r.gl;
  const err = gl.getError();
  if (err !== 0) window.RESULT.errors.push('glError 0x'+err.toString(16));
  const px = new Uint8Array(320*200*4);
  gl.readPixels(0,0,320,200,gl.RGBA,gl.UNSIGNED_BYTE,px);
  let nonBlack = 0, sum = 0;
  for (let i=0;i<px.length;i+=4){ const v=px[i]+px[i+1]+px[i+2]; sum+=v; if(v>6) nonBlack++; }
  window.RESULT.nonBlackPixels = nonBlack;
  window.RESULT.meanLum = sum/(320*200*3);
  window.RESULT.bodies = r.bodyCount;
  window.RESULT.ok = true;
  window.RESULT.stage = 'done';
} catch (e) {
  window.RESULT.errors.push(String(e && e.stack || e));
}
window.DONE = true;
</script></body></html>
