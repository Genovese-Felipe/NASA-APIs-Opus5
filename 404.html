<!-- The only file in this project allowed root-absolute paths, and required to

     a relative href here resolves against whatever the visitor mistyped rather
     than against the site root. The cost is that the repository name is baked
     in: rename the repository, or move it to a custom domain, and these two
     links are what you have to change. tools/lint.mjs exempts this file by
     name for exactly this reason. -->

  a { color: var(--accent); }
</style>
</head>
